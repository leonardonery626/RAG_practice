name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nox:
    name: nox -s ${{ matrix.session }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: [format, lint, typing, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run nox -s ${{ matrix.session }}
        run: uvx --from "nox[uv]" nox -s ${{ matrix.session }}

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.session }}-reports
          path: .reports/
          if-no-files-found: ignore
