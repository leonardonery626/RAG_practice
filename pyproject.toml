[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-practice"
version = "0.1.0"
description = "RAG practice project for PDF chunking, embedding, and retrieval."
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "faiss-cpu>=1.14.3",
    "numpy>=2.0.0",
    "pdfplumber>=0.11.10",
    "sentence-transformers>=5.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.9.0",
    "accelerate>=1.14.0",
]

[project.urls]
repository = "https://github.com/leonardonery626/RAG_practice"

[project.scripts]
chunk_pdf = "src.pipeline.chunking:main"
build_embeddings = "src.pipeline.embedding:main"
local_server = "src.local_server.web_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# -----------------------------------------------
# Dependencies management
# -----------------------------------------------
[dependency-groups]
dev = [
    "nox[uv]>=2025.5.1",
    "pre-commit==4.5.1",
    "pip-system-certs>=5.2,<6" # Required to use installed certificates for LLMApim ssl requests
]
format = ["ruff>=0.14.1,<0.15"]
lint = [
    "ruff>=0.14.1,<0.15",
    "junit2html>=31.0.3,<32",
    "hadolint-py @ git+https://git@github.com/AleksaC/hadolint-py@v2.14.0",
]
typing = [
    "mypy>=1.8,<2",
    "typing-extensions>=4.9.0,<5",
    "types-setuptools>=68.0",
]
test = [
    "pytest>=8.0.0,<9",
    "pytest-html>=4.1.1,<5",
    "coverage[toml]>=7.3.2,<8",
    "pytest-mock>=3.12.0,<4",
    "pytest-retry>=1.6.2,<2",
    "pytest-order>=1.3.0,<2",
    "freezegun>=1.4.0,<2"
]

# -----------------------------------------------
# Test tooling configuration
# -----------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true


[tool.mypy]
exclude = "^src/tests/"
ignore_missing_imports = true
